<!--  Form & Button Style
Button bisa tanpa form
Button type nya: button, submit, reset
- button untuk hanya tombol yang menjalankan Js, tanpa kirim form, lebih buka modal, preview, tambah item dan interaksi ui.
- reset untuk kembalikan form ke kondisi awal
- submit untuk kirim data form, tanpa di set browser default baca submit

Input untuk menyimpan data yang bisa di simpan
Input type : radio, checkbox
- radio : jika user hanya pilih satu
- checkbox : user dapat memilih lebih dari 1 opsi
 - name : untuk mengelompokkan pilihan, wajib ada untuk elemen apapun yang akan mengirim data ke server (input,select,textarea) dapat di katakan di HTML mirip dengan nama variable yang di kirim ke server
  -id="nama" → dipakai HTML/CSS/JavaScript.
  -name="nama" → dipakai saat submit form.
 - value : nilai yang di kirim saat input di pilih
 - checked : menjadikan pilihan default
- label -> dapat di pakai untuk mengurung input agar lebih rapih dan dapat membuat text dalam label terklik juga
    - jika dalam 1 elemen p sebelum select ada for artinya saat label di klik dapat otomatis fokus pada dropdown select

Select di gunakan untuk dropdown menu
sama seperti input dimana ada name, value, sedangkan checked menjadi selected untuk default
- untuk membuat placeholder pakai disabled selected yang biasanya dengan value kosong / "", disabled membuat pilihan ini tidak dapat di pilih hanya di tampilkan untuk awal
- option pilihan pada select

tombol / link CTA (Call To Action) adalah elemen pada website, iklan, email, atau aplikasi yang bertujuan mengajak pengguna melakukan tindakan tertentu.
