    <!-- Optional video or image card -->

        <img src="https://via.placeholder.com/250x250.png" alt="Video thumbnail">
        <p class="description">Embedded YouTube video example (replace with real video if you have one).</p>
    </div>
    <div class="card">
        <video controls muted>
            <source src="https://www.youtube.com/watch?v=HiQq_iseViY" type="video/mp4">
            Browser Anda tidak mendukung tag video.
        </video>

        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/HiQq_iseViY" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>

        <audio controls>
            <source src="music.mp3" type="audio/mpeg">
            <source src="music.ogg" type="audio/ogg">
        </audio>
    </div>

<!--  Multi media (video, audio, image, etc.) 
image img elemen untuk meletakkan gambar
    - src = path to the image file
    - alt = alternative text for the image, deskripsi gambar sejelas mungkin
    - width / height = width and height of the image in pixels
        - % = agar lebih responsive mengikuti ukuran container
        - px = pixel cocok untuk gambar dengan resolusi kecil seperti PP
        - max-width: 100% = agar tidak melebihi lebar container
        - height: auto = mengatur ukuran video sesuai ukuran container
        - css =untuk versi webdev modern lebih banyak di set heigh, width dan tampilan di css

    -div = sering di pakai untuk container multimedia agar mudah di atur posisinya

audio elemen untuk meletakkan audio
video elemen untuk meletakkan video (lokal / di server)

ada dalam elemen audio dan video:
    - controls = menambahkan kontrol play/pause,
    volume, dan seek bar. Tanpa control biasanya tidak memiliki kontrol player yang terlihat
    - autoplay = memutar video secara otomatis ketika halaman 
    - loop = memutar kembali saat audio selesai 
    - muted = membuat audio dalam kondisi mute

 - source = elemen untuk set file source dan type
    - src = path to the audio file
    - type = type of the audio file (mp3,ogg /dll)



CSS
- object-fit: cover = membuat gambar memenuhi area yang ditentukan sambil mempertahankan proporsi gambar.
- display: flex = membuat card dapat disusun secara horizontal.





-->
