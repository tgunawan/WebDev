    <h1 class="section-title" id="Gallery">Gallery</h1>

    <div class="gallery" >
        <!-- Gallery Card 1 -->
        <div class="image-card">
            <img src="https://via.placeholder.com/250x250.png" alt="Gallery image 1">
            <p class="description">Description of gallery image 1</p>
        </div>

        <!-- Gallery Card 2 -->
        <div class="image-card">
            <img src="https://via.placeholder.com/250x250.png" alt="Gallery image 2">
            <p class="description">Description of gallery image 2</p>
        </div>
    </div>

    <!-- Optional video or image card -->
    <div class="card">
        <img src="https://via.placeholder.com/250x250.png" alt="Video thumbnail">
        <p class="description">Embedded YouTube video example (replace with real video if you have one).</p>
    </div>
    <div class="card">
        <video controls muted>
            <source src="https://www.youtube.com/watch?v=HiQq_iseViY" type="video/mp4">
            Browser Anda tidak mendukung tag video.
        </video>

        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/HiQq_iseViY" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>

        <audio controls>
            <source src="music.mp3" type="audio/mpeg">
            <source src="music.ogg" type="audio/ogg">
        </audio>
    </div>
